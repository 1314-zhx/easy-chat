version: '3.8'

services:
  # ========== Prometheus ==========
  prometheus:
    image: prom/prometheus:latest
    container_name: easy-chat-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - ./prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'  # 支持热更新配置
    restart: unless-stopped

  # ========== Grafana ==========
  grafana:
    image: grafana/grafana:latest
    container_name: easy-chat-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

  # ========== AlertManager (可选) ==========
  alertmanager:
    image: prom/alertmanager:latest
    container_name: easy-chat-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml
    restart: unless-stopped

  # ========== Kafka ==========
  kafka:
    image: bitnami/kafka:3.6
    container_name: easy-chat-kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_INTER_BROKER_LISTENER_NAME=PLAINTEXT
      - KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE=true
    volumes:
      - ./kafka_data:/bitnami/kafka
    restart: unless-stopped
    networks:
      - easy-chat

  # ========== OTLP Collector ==========
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.91.0
    container_name: easy-chat-otel-collector
    command: ["--config=/etc/otel-collector-config.yaml"]
    ports:
      - "4317:4317"        # OTLP gRPC
      - "4318:4318"        # OTLP HTTP
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml
    depends_on:
      - kafka
    restart: unless-stopped
    networks:
      - easy-chat

  # ========== MongoDB ==========
  mongo:
    image: mongo:6
    container_name: easy-chat-mongo
    ports:
      - "27017:27017"
    volumes:
      - ./mongo_data:/data/db
    restart: unless-stopped
    networks:
      - easy-chat

  # ========== Jaeger All-in-One (MongoDB Storage Plugin) ==========
  # 使用官方 MongoDB Storage Plugin
  jaeger:
    image: jaegertracing/jaeger:1.52
    container_name: easy-chat-jaeger
    command: >
      --query.grpc-server.host-port=:14250
      --query.http-server.host-port=0.0.0.0:16686
      --grpc-storage-plugin.binary=/plugin/jaeger-storage-grpc-plugin
      --grpc-storage-plugin.configuration-file=/etc/jaeger/config.yaml
    ports:
      - "16686:16686"      # Jaeger UI
      - "14250:14250"      # gRPC Storage Plugin
      - "14268:14268"      # Collector HTTP
      - "4317:4317"        # OTLP gRPC (可选)
      - "4318:4318"        # OTLP HTTP (可选)
    volumes:
      - ./jaeger-plugin:/plugin
      - ./jaeger/config.yaml:/etc/jaeger/config.yaml
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - easy-chat

networks:
  easy-chat:
    driver: bridge
