receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024

exporters:
  # 发送到 Kafka
  kafka:
    brokers:
      - "kafka:9092"
    topic: jaeger-traces
    encoding: otlp_json

  # 同时打印到日志，方便调试
  logging:
    verbosity: detailed

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [kafka, logging]
