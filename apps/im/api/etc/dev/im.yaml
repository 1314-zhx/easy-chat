Name: im
Host: 0.0.0.0
Port: 8888

JwtAuth:
  AccessSecret: your-secret-key-here
  AccessExpire: 86400

Redisx:
  Host: 127.0.0.1:6379
  Type: node

Telemetry:
  Name: im-api
  Endpoint: http://127.0.0.1:4318
  Sampler: 1.0
  SamplerType: const

ImRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: im.rpc
  CircuitBreaker:
    Enable: true
    ErrorRate: 50
    MinSample: 100
    OpenDuration: 10s

SocialRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: im.rpc
  CircuitBreaker:
    Enable: true
    ErrorRate: 50
    MinSample: 100
    OpenDuration: 10s

UserRpc:
  Etcd:
    Hosts:
      - 127.0.0.1:2379
    Key: user.rpc
  CircuitBreaker:
    Enable: true
    ErrorRate: 50
    MinSample: 100
    OpenDuration: 10s
